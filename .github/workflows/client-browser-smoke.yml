name: client-browser-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.58.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive and accessibility smoke tests
        run: npx playwright test
      - name: Upload browser test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-browser-smoke-${{ github.run_number }}
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7
