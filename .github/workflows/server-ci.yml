name: server-ci

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        # Plain postgres:16 doesn't ship the `vector` extension that the
        # knowledge-base migration (1758240000038_create-knowledge-base)
        # requires — `create extension if not exists vector` fails with
        # "extension \"vector\" is not available" and every migration
        # after it never runs. pgvector/pgvector:pg16 is the same Postgres
        # 16 with pgvector pre-built in, nothing else different.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: signalai
          POSTGRES_PASSWORD: signalai
          POSTGRES_DB: signalai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://signalai:signalai@localhost:5432/signalai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Runs the real production build, not just a typecheck: `typecheck` uses
      # tsconfig.json (which includes tests), while the deploy uses
      # tsconfig.build.json. Only this step exercises what Render actually runs,
      # and its absence is why a broken build reached the deploy.
      - run: npm run build
      - run: npx node-pg-migrate up --migration-file-language sql
      - run: npm test
