services:
  - type: web
    name: signalai-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:up
    # --include=dev is required: NODE_ENV=production (below) makes npm omit
    # devDependencies, and the build needs typescript, @types/*, and
    # node-pg-migrate. npm ci rather than npm install so the lockfile is
    # authoritative and a deploy can't silently resolve different versions.
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Database, hosted on Neon (see docs/signalAI_roadmap.md Tech Stack) —
      # not Render's own Postgres, which expires after 30 days.
      - key: DATABASE_URL
        sync: false
      # From the Meta Developer App (Instagram Business Login).
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: TOKEN_ENCRYPTION_KEYS
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Where BUI is deployed — used for OAuth/Stripe redirects and CORS.
      - key: APP_BASE_URL
        sync: false
      - key: WEB_APP_ORIGIN
        sync: false
      - key: AI_DAILY_CALL_CAP
        value: "300"
      # Optional — leave unset to run without billing/alerts.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # AI-Generated Reply / Milestone Engine chat provider — any
      # OpenAI-compatible /chat/completions host (Groq, Together, DeepSeek,
      # hosted Ollama, Gemini's compat layer). Every ai_generated campaign
      # fails closed to its rule-based reply if this is unset — not
      # required for the app to boot, but required for AI replies to work.
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      # Phase 2C Knowledge Base: a SEPARATE OpenAI-compatible embeddings
      # endpoint, independent of the chat provider above — not every chat
      # host also serves embeddings. Optional: unset means Knowledge Base
      # upload degrades to a clear 503, everything else is unaffected.
      - key: EMBEDDING_BASE_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      # Matryoshka-style truncation for models whose natural output width
      # doesn't match knowledge_base_chunks.embedding's fixed vector(768)
      # column — gemini-embedding-001 (this project's confirmed working
      # model/base URL combination) natively returns 3072 dims and needs
      # this set to "768". Leave unset for a model that's already 768-wide.
      - key: EMBEDDING_DIMENSIONS
        sync: false
      # Phase 2C Knowledge Base: Neon's S3-compatible object storage for
      # uploaded source documents. AWS_ENDPOINT_URL_S3/AWS_REGION/
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are the AWS SDK's own
      # standard env var names — @aws-sdk/client-s3 reads them automatically,
      # nothing in this codebase references them directly. Also optional —
      # same graceful-503 degradation as the embeddings vars above.
      - key: KB_S3_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # BUI — the creator-facing React SPA (client/). A static site: Vite builds
  # to client/dist and Render just serves those files, so there's no
  # spin-down behaviour to worry about the way there is for the web service.
  - type: web
    name: signalai-bui
    runtime: static
    rootDir: client
    # Same --include=dev reasoning as the server above: `build` runs
    # `tsc -b && vite build`, and both vite and typescript are
    # devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      # NOT optional. The server's OAuth callback does a top-level browser
      # redirect to /connected#token=..., and /dashboard/:tenantId is a
      # client-side route — both are direct loads of paths with no file
      # behind them. Without this rewrite Render serves 404 and the entire
      # connect flow breaks, not merely deep links.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Inlined by Vite AT BUILD TIME, not read at runtime — changing it
      # needs a rebuild, not a restart. Defaults to http://localhost:3000
      # in src/api.ts, so leaving it unset fails silently against the
      # viewer's own machine. Set it to the signalai-server URL.
      - key: VITE_API_BASE_URL
        sync: false
