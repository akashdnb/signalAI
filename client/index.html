<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applied before any CSS renders, so an explicit theme choice (see
      // src/lib/theme.ts) never flashes the wrong palette on load. No
      // stored value means "follow the OS" — index.css's media query
      // alone handles that case, so this script does nothing.
      (function () {
        try {
          var theme = localStorage.getItem("signalai.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Same FOUC-prevention pattern as the theme script above, for the
      // accent palette (see src/lib/palette.ts). Unlike theme, there's no
      // "unset means follow something else" case — index.css's :root
      // already carries the default (navy-cobalt) palette's values, so
      // this only needs to act when an explicit non-default choice exists.
      (function () {
        try {
          var palette = localStorage.getItem("signalai.palette");
          if (palette && palette !== "navy-cobalt") {
            document.documentElement.setAttribute("data-palette", palette);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>signalAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
